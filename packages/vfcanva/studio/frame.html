<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>VF frame</title>
  <style>
    html, body { margin: 0; background: #f4efe6; }
    .frame {
      width: 1080px;
      height: 1080px;
      background: #f4efe6;
      color: #1a1814;
      font-family: "Helvetica Neue", Arial, sans-serif;
      position: relative;
    }
    .frame.story { height: 1920px; }
    .inner {
      position: absolute;
      inset: 0;
      padding: 88px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .frame.story .inner { padding: 280px 72px 380px; }
    .kicker { font-size: 22px; letter-spacing: 0.08em; color: #6b6458; }
    .hook { font-size: 72px; line-height: 1.15; font-weight: 650; margin: 18px 0 0; }
    .job { font-size: 32px; color: #6b6458; margin-top: 20px; }
    .cta {
      border-top: 1px solid #c9c1b3;
      padding-top: 28px;
      font-size: 28px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <article class="frame" id="card">
    <div class="inner">
      <div>
        <div class="kicker">@velvets_cloud</div>
        <h2 class="hook" id="hookOut"></h2>
        <p class="job" id="jobOut"></p>
      </div>
      <div class="cta">
        <span>050-2517000</span>
        <span>איסוף שדרות</span>
      </div>
    </div>
  </article>
  <script>
    const q = new URLSearchParams(location.search);
    const story = q.get("format") === "ig_story" || q.get("format") === "ig_reel_cover";
    document.getElementById("card").classList.toggle("story", story);
    document.getElementById("hookOut").textContent = q.get("hook") || "חסר הוק";
    document.getElementById("jobOut").textContent = q.get("job") || "";
  </script>
</body>
</html>
