# VelvetOS remote Instagram MCP (Streamable HTTP)
# Deploy: flyctl launch --copy-config --yes  OR  flyctl deploy
# Secrets: fly secrets set INSTAGRAM_MCP_ACCESS_TOKEN=… INSTAGRAM_MCP_IG_USER_ID=17841407772120429 VELVET_INSTAGRAM_MCP_BEARER_TOKEN=…
# Do not put secret values in this file.

app = "velvet-instagram-mcp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  INSTAGRAM_MCP_HOST = "0.0.0.0"
  INSTAGRAM_MCP_PORT = "8080"
  INSTAGRAM_MCP_PATH = "/mcp"
  INSTAGRAM_MCP_TRANSPORT = "streamable-http"
  # INSTAGRAM_MCP_DM_ENABLED must remain unset/false

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
