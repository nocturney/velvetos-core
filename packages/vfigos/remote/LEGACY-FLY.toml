# Legacy — Fly.io deploy for Instagram MCP remote (superseded 2026-09-08)
#
# Active production path: Google Cloud Run — see ../REMOTE.md and service.yaml.
# This file is kept only as historical reference. Do not use for new deploys.
# Sensors must NOT require this file.

app = "velvet-instagram-mcp-LEGACY-DO-NOT-USE"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  INSTAGRAM_MCP_HOST = "0.0.0.0"
  INSTAGRAM_MCP_PORT = "8080"
  INSTAGRAM_MCP_PATH = "/mcp"
  INSTAGRAM_MCP_TRANSPORT = "streamable-http"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
