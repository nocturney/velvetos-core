name: VF Media Auto Intake

# Scheduled background intake for Drive inbox -> canonical vfmedia catalog.
# Target cadence: every 5 minutes (GitHub Actions minimum schedule interval).
# Platform caveat: scheduled runs are best-effort and may be delayed under load.
# validate (vfmedia.py validate) is NOT this job - it is schema-only.
#
# Authentication uses GitHub OIDC -> Google Workload Identity Federation.
# The workflow mints a short-lived Drive access token; no long-lived Google
# JSON key or repository secret is required.
#
# Exit codes:
#   0 OK
#   1 FAIL (listing/processing)
#   2 BUSY (overlap)
#   3 AUTH (Drive credentials unavailable / rejected)
#   4 PERSIST (state could not be saved)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_files:
        description: "Max inbox files to process this run"
        required: false
        default: "50"
      register_only:
        description: "Register into catalog only (skip verify/move)"
        required: false
        default: "false"

concurrency:
  group: vfmedia-intake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  media-intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hardening unit tests
        run: python3 packages/vfmedia/tests/test_intake_hardening.py -v

      - name: Offline selftest
        run: python3 scripts/vfmedia.py intake selftest

      - name: Install Drive client
        run: pip install --quiet google-api-python-client google-auth

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1016876126699/locations/global/workloadIdentityPools/github-actions/providers/velvetos-core
          service_account: velvetos-media-intake@instamcp.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false

      - name: Verify federated credentials
        id: creds
        env:
          GOOGLE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -e
          if [ -z "${GOOGLE_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::OIDC authentication did not mint a Drive access token."
            exit 1
          fi
          echo "OIDC/WIF Drive token minted successfully"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run intake against Google Drive
        id: intake
        env:
          GOOGLE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          EXTRA=""
          if [ "${{ github.event.inputs.register_only }}" = "true" ]; then
            EXTRA="--register-only"
          fi
          MAX="${{ github.event.inputs.max_files }}"
          MAX="${MAX:-50}"
          python3 scripts/vfmedia.py intake run --provider google --max-files "$MAX" --mark-activation $EXTRA
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python3 scripts/vfmedia.py intake status || true
          exit 0

      - name: Persist intake state (including blocked/fail)
        id: persist
        run: |
          set -e
          git config user.name "velvetos-media-intake"
          git config user.email "noreply@velvetos.local"
          if git diff --quiet -- packages/vfmedia/catalog.json packages/vfmedia/state packages/vfmedia/data office/control/inbox.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No intake artifacts to commit"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git add packages/vfmedia/catalog.json packages/vfmedia/state packages/vfmedia/data office/control/inbox.json
          git commit -m "vfmedia intake: durable catalog/state from scheduled run (exit ${{ steps.intake.outputs.exit_code }})"
          branch="${{ github.ref_name }}"
          git fetch origin "$branch"
          if ! git rebase "origin/$branch"; then
            git rebase --abort || true
            echo "::error::Concurrent update conflicted with vfmedia state. Refusing to persist conflict markers; retry on a fresh checkout."
            exit 4
          fi
          git push origin "HEAD:$branch"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Sensor slice
        run: |
          python3 scripts/check-vfmedia.py
          python3 scripts/vfmedia.py validate

      - name: Fail on AUTH / FAIL / PERSIST / push problems
        if: always()
        run: |
          code="${{ steps.intake.outputs.exit_code }}"
          ready="${{ steps.creds.outputs.ready }}"
          if [ "$ready" != "true" ] || [ "$code" = "3" ]; then
            echo "::error::Drive AUTH blocked auto-intake (exit=$code). OIDC/WIF credentials were not usable."
            exit 1
          fi
          if [ "$code" = "4" ]; then
            echo "::error::Persist failure - state could not be saved durably (exit 4)."
            exit 1
          fi
          if [ "$code" = "1" ]; then
            echo "::error::Intake failed (exit 1). See logs; backoff recorded in runner state."
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::notice::Overlapping intake skipped (concurrency/local lock)."
            exit 0
          fi
          if [ "$code" != "0" ] && [ -n "$code" ]; then
            echo "::error::Unexpected intake exit=$code"
            exit 1
          fi
          exit 0
