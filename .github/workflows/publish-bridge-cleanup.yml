name: Publish bridge cleanup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bridge-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core policy/scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: core

      - name: Checkout publish bridge branch
        uses: actions/checkout@v4
        with:
          ref: publish-bridge
          fetch-depth: 0
          path: bridge

      - name: Remove expired assets from branch head
        run: |
          python3 core/scripts/vf_publish_bridge_cleanup.py \
            --root bridge/publish-bridge/assets \
            --retention-days 14

      - name: Commit cleanup when needed
        working-directory: bridge
        run: |
          if git diff --quiet -- publish-bridge/assets; then
            echo "No expired bridge assets"
            exit 0
          fi
          git config user.name "VelvetOS Publish Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add -A publish-bridge/assets
          git commit -m "publish-bridge: prune expired assets from branch head"
          git push origin HEAD:publish-bridge
