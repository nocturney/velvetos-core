name: Publish bridge archive

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bridge-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core policy/scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: core

      - name: Checkout publish bridge branch
        uses: actions/checkout@v4
        with:
          ref: publish-bridge
          fetch-depth: 0
          path: bridge

      - name: Archive expired active assets
        run: |
          python3 core/scripts/vf_publish_bridge_cleanup.py \
            --root bridge/publish-bridge/assets \
            --archive-root bridge/publish-bridge/archive \
            --retention-days 14

      - name: Commit archive moves when needed
        working-directory: bridge
        run: |
          if git diff --quiet -- publish-bridge/assets publish-bridge/archive; then
            echo "No bridge assets ready for archive"
            exit 0
          fi
          git config user.name "VelvetOS Publish Bridge"
          git config user.email "actions@users.noreply.github.com"
          git add -A publish-bridge/assets publish-bridge/archive
          git commit -m "publish-bridge: archive expired active assets"
          git push origin HEAD:publish-bridge
