name: Office 2.0 board

# Manual dispatch only. Scheduler authority belongs to ChatGPT automations.
# This job reads GitHub and uploads the board. It does not push or comment.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  board:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.17"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.11.17 --filename python-3.11.17-linux-24.04-x64.tar.gz --expected ae713815fe406a06f1691856f697a0b1e58b3e986f44e62f0cd0bca2424f1aac --checksum-url https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/hashes.sha256

      - name: Build the office board
        env:
          GH_TOKEN: ${{ github.token }}
        # Artifact only. --omit-private keeps a private repo out of this public upload.
        # latest.md and latest.json are gitignored, so this job does not commit them.
        run: python3 scripts/office_v2_mvp.py --write --omit-private

      - name: Upload the office board
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: office-v2-board
          path: |
            docs/office-v2/board/latest.md
            docs/office-v2/board/latest.json
          if-no-files-found: error
          retention-days: 7
