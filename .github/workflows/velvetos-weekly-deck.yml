name: VelvetOS Weekly Deck
# VELVET_MACHINE_WRITER_ALLOW: docs/weekly-deck packages/vfbriefux/hq/weekly-deck.bento-doc.json

# Builds a bento/slides recap deck from real repo data (LEARNINGS/LAST30/retro)
# and publishes it to GitHub Pages under /weekly-deck. Runs on weekends so a
# link is ready before the Friday/Sunday brief goes out. Never fabricates
# numbers — see packages/vfbriefux/hq/BENTO.md.
#
# Asia/Jerusalem timing: cron '0 6 * * 5' = Friday 09:00 IDT / 08:00 IST.
on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  build-and-publish:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.17"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.11.17 --filename python-3.11.17-linux-24.04-x64.tar.gz --expected ae713815fe406a06f1691856f697a0b1e58b3e986f44e62f0cd0bca2424f1aac --checksum-url https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/hashes.sha256

      - name: Build weekly deck (JSON + HTML)
        run: python3 scripts/vf_weekly_deck.py

      - name: Commit deck to docs/weekly-deck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "velvetos-bot"
          git config user.email "actions@github.com"
          git add docs/weekly-deck packages/vfbriefux/hq/weekly-deck.bento-doc.json
          if git diff --cached --quiet; then
            echo "Weekly deck already current"
            exit 0
          fi
          git commit -m "Weekly deck $(date -u +%F)"
          bash scripts/push-main-with-check-all.sh main
