name: README System Pulse
# VELVET_MACHINE_WRITER_ALLOW: README.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "office/control/HANDOFF.json"
      - "office/ledger/bindings.json"
      - "packages/vfigos/CAPABILITIES.json"
      - "packages/vfmedia/state/intake-runner.json"
      - "packages/velvetos/living-studio/REGISTRY.json"
      - "packages/velvetos/policy/sensor-registry.json"
      - "packages/manifest.json"
      - "scripts/update-readme-snapshot.py"
      - "scripts/fix-readme-bidi.py"
      - "office/ledger/live/sync-receipt.json"
  # Machine writers push their evidence with GITHUB_TOKEN, and GitHub never
  # starts a `push` workflow for GITHUB_TOKEN pushes. Without this trigger the
  # pulse inputs they commit (HANDOFF.json, intake-runner.json, sync-receipt.json)
  # leave README stale on main, and every unrelated PR fails the PR-only
  # "README System Pulse is current" gate. Still event-driven: no cron here.
  workflow_run:
    workflows:
      - "Office Control Plane"
      - "VF Media Auto Intake"
      - "Jobs Sheet Write-Through"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: readme-system-pulse
  cancel-in-progress: true

jobs:
  refresh:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.17"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.11.17 --filename python-3.11.17-linux-24.04-x64.tar.gz --expected ae713815fe406a06f1691856f697a0b1e58b3e986f44e62f0cd0bca2424f1aac --checksum-url https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/hashes.sha256

      - name: Render repository-backed System Pulse
        run: python3 scripts/update-readme-snapshot.py

      - name: Normalize Hebrew BiDi rendering
        run: python3 scripts/fix-readme-bidi.py

      - name: Validate Hebrew BiDi contract
        run: python3 scripts/fix-readme-bidi.py --check

      - name: Commit only when README changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README System Pulse"
          bash scripts/push-main-with-check-all.sh main
