name: VelvetOS Research Cadence

# The actual research body is produced by the owner-facing Velvet Research Seat at
# 02:00 Asia/Jerusalem, with a 07:00 readiness cutoff for the 09:00 Morning Brief.
# GitHub Actions does not pretend to replace WebSearch/body research; it verifies
# freshness, builds the semantic index, and runs sensors after the live seat has had
# several hours to complete. 04:30 UTC is 07:30 IDT (summer) / 06:30 IST (winter),
# always after the 02:00 seat. Freshness failure remains honest evidence of a missing body.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  daily-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semantic-search deps
        run: pip install scikit-learn

      - name: Cadence map + DST note
        run: python3 scripts/vfresearch_cadence.py map

      - name: Verify same-day research body freshness
        run: python3 scripts/vfresearch_cadence.py freshness

      - name: Build semantic index (fail closed)
        run: python3 scripts/vfresearch_cadence.py build-index

      - name: Upload semantic index for consumers
        uses: actions/upload-artifact@v4
        with:
          name: vfmem-semantic-index
          path: packages/vfmem/semantic_index.pkl
          if-no-files-found: error
          retention-days: 7

      - name: Verify research artifact structure
        run: python3 scripts/vfresearch_cadence.py verify

      - name: Status (honest activation flags)
        run: python3 scripts/vfresearch_cadence.py status

      - name: Run office sensor suite
        run: python3 scripts/check-all.py
