name: VelvetOS Research Verification

# Research is manual/event-driven after the 2026-10-06 scheduler simplification.
# This workflow verifies a research artifact/index when explicitly dispatched; it
# does not create a research body and has no recurring clock. Any owner-facing
# timing semantics remain Asia/Jerusalem and therefore follow local DST.
on:
  workflow_dispatch:

jobs:
  research-verification:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.15"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.12.15 --filename python-3.12.15-linux-24.04-x64.tar.gz --expected fcb672b0437c2d8df5565b7cc250b2b0d7455e2b8d6a4a107cfa6f2efe4f7ed8 --checksum-url https://github.com/actions/python-versions/releases/download/3.12.15-36805895057/hashes.sha256

      - name: Install sensor runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-sensors.py312.lock
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Research routing map
        run: python3 scripts/vfresearch_cadence.py map

      - name: Verify explicitly produced research body freshness
        run: python3 scripts/vfresearch_cadence.py freshness

      - name: Build semantic index
        run: python3 scripts/vfresearch_cadence.py build-index

      - name: Upload semantic index for consumers
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vfmem-semantic-index
          path: packages/vfmem/semantic_index.pkl
          if-no-files-found: error
          retention-days: 7

      - name: Verify research artifact structure
        run: python3 scripts/vfresearch_cadence.py verify

      - name: Status
        run: python3 scripts/vfresearch_cadence.py status

      - name: Run routed research verification sensors
        run: |
          python3 scripts/check-vfresearch.py
          python3 scripts/check-vfmem.py
