name: VelvetOS Core Sensors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Used by protected machine writers for exact-SHA precheck and for an
  # explicit post-push full-suite run when GITHUB_TOKEN suppresses push events.
  workflow_dispatch:
    inputs:
      execution:
        description: "Machine execution mode"
        required: false
        default: "machine_precheck"
        type: choice
        options:
          - machine_precheck
          - main_full

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install sensor runtime dependencies
        run: |
          # Hashed full lock (direct + indirect); regenerate with scripts/regen-sensor-locks.sh
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-sensors.py311.lock
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Sensor selector
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution != 'main_full') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # GitHub git-over-HTTPS accepts basic x-access-token. A bearer scheme is rejected.
            basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$basic"
            git -c "http.extraheader=AUTHORIZATION: basic ${basic}" fetch origin main
            base="$(git rev-parse origin/main)"
            head="$GITHUB_SHA"
          fi
          python3 scripts/sensor_selector.py \
            --base "$base" \
            --head "$head" \
            --output sensor-selection.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Instagram publish policy test vectors
        run: node packages/velvetos/policy/test-instagram-publish-policy.mjs

      # README gate: routine output (research artifacts, checkpoints, briefs, data files)
      # is exempt; code/config/contract changes still require README.md.
      # See scripts/readme_contract.py (ROUTINE_OUTPUT) and scripts/check-readme-contract.py.
      - name: Living README contract
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/readme_contract.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      # Fragment gate: a capability diff needs changelog.d/<slug>.md or CHANGELOG.md.
      # Compile stays manual. This step does not run changelog-compile.py.
      - name: Changelog fragment contract
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/changelog_contract.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: README System Pulse is current
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 scripts/update-readme-snapshot.py --check

      - name: README Hebrew BiDi and language anchors are valid
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 scripts/fix-readme-bidi.py --check

      # check-all.py forwards this read-only token only to the gh sensor.
      - name: Run selected VelvetOS sensors on pull request or machine precheck
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution != 'main_full')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-all.py --selection sensor-selection.json --json-out sensor-selected-results.json

      # check-all.py forwards this read-only token only to the gh sensor.
      - name: Run full VelvetOS sensor suite on main
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execution == 'main_full')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-all.py --json-out sensor-full-results.json

      # Report-only. The frontend repo is private, so GITHUB_TOKEN normally cannot
      # read it and this prints SKIP. With access, drift shows as a ::warning::.
      - name: Instance scaffold drift (check-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash scripts/sync-instance-scaffold.sh --skip-if-inaccessible

      - name: Fail build on sensor error
        if: failure()
        run: echo "::error::One or more VelvetOS contract checks failed. See log above." && exit 1

  publish-check-all-status:
    # statuses: write stays off the sensor job. This token only posts the
    # machine-precheck commit status after that job has already passed.
    needs: check-all
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.execution != 'main_full' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish verified check-all commit status for machine precheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=check-all \
            -f description='VelvetOS exact-SHA precheck passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Windows suite. A failing check-all fails this job and the workflow.
  # Ruleset 23284099 still requires only the Linux job's check-all status.
  # This job publishes no commit status.
  # pull_request and push only: machine workflow_dispatch stays on check-all.
  # GITHUB_ACTIONS=true turns a missing ffmpeg into a video-sensor failure, so
  # this job installs one hash-pinned full build before the suite. POSIX-only
  # tests still print SKIP_NON_POSIX on this runner. A local host without
  # ffmpeg still reports SKIP_ENV_MISSING_<CAP>.
  check-all-windows:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Keep repository bytes LF
        shell: pwsh
        run: git config --global core.autocrlf false

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The suite reads pinned blobs with git show <sha>:path.
          fetch-depth: 0
          persist-credentials: false

      # Positive allowlist: Parser::ParseInput on the ffmpeg step body.
      - name: ffmpeg hash-gate allowlist
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/check-ffmpeg-hash-gate.ps1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install hashed sensor lock and pinned ffmpeg
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-sensors.py311.lock
          $expected = "d760e1b3574402ed18b4865851f87d87e73965a982e6453212df8621fed1c508"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-7.1.1-full_build.zip"
          curl.exe -fsSL -o "$zip" "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build.zip"
          python scripts/verify_ffmpeg_zip_sha256.py --path $zip --expected $expected
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg zip sha256 mismatch: $expected" }
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = Get-ChildItem -Path $dest -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe missing from the pinned zip" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName

      # check-all.py forwards this read-only token only to the gh sensor.
      - name: Run check-all
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "check-all-windows.log"
          python scripts/check-all.py *> "$log"
          $code = $LASTEXITCODE
          Get-Content -Path $log
          exit $code

      - name: Upload check-all log
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: check-all-windows
          path: ${{ runner.temp }}/check-all-windows.log
          if-no-files-found: error
