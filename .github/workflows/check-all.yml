name: VelvetOS Core Sensors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all VelvetOS sensors
        run: python3 scripts/check-all.py
      - name: Fail build on sensor error
        if: failure()
        run: echo "::error::One or more check-*.py sensors failed. See log above." && exit 1
