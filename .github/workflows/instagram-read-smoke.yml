name: Instagram Read Smoke
# Read-only live MCP smoke (Graph GETs only, via smoke_public.py READ_ONLY_TOOLS).
# Offline unit tests are owned by check-vfmcp.py / code-change validation.
# Never publishes, deletes, DMs or commits.
# Live part needs repo secret VELVET_INSTAGRAM_MCP_BEARER_TOKEN; without it
# the step prints SKIP and stays green (no numbers claimed).

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"
  push:
    branches: [main]
    paths:
      - "packages/vfigos/remote/**"
      - ".github/workflows/instagram-read-smoke.yml"

permissions:
  contents: read

concurrency:
  group: instagram-read-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.17"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.11.17 --filename python-3.11.17-linux-24.04-x64.tar.gz --expected ae713815fe406a06f1691856f697a0b1e58b3e986f44e62f0cd0bca2424f1aac --checksum-url https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/hashes.sha256

      - name: Install pinned sensor deps
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-sensors.py311.lock

      - name: Live read-only smoke (skips without bearer secret)
        env:
          VELVET_INSTAGRAM_MCP_BEARER_TOKEN: ${{ secrets.VELVET_INSTAGRAM_MCP_BEARER_TOKEN }}
          INSTAGRAM_MCP_REMOTE_URL: ${{ vars.INSTAGRAM_MCP_REMOTE_URL }}
        shell: bash
        run: |
          set +e
          python3 packages/vfigos/remote/smoke_public.py --skip-if-missing > smoke.txt 2>&1
          rc=$?
          set -e
          cat smoke.txt
          {
            echo '### Instagram read smoke'
            echo "exit=${rc}"
            echo '```'
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"
