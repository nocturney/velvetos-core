name: Instagram read-source observer checks

on:
  pull_request:
    paths:
      - "packages/vfigos/schedule_observer/**"
      - ".github/workflows/instagram-read-source-observer.yml"
  push:
    branches: [main]
    paths:
      - "packages/vfigos/schedule_observer/**"
      - ".github/workflows/instagram-read-source-observer.yml"

permissions:
  contents: read

jobs:
  offline-contract:
    # The pinned actions/python-versions asset is the linux-24.04 build. ubuntu-latest moves to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.17"

      - name: Verify Python toolchain checksum
        run: python3 scripts/verify_actions_python_sha256.py --version 3.11.17 --filename python-3.11.17-linux-24.04-x64.tar.gz --expected ae713815fe406a06f1691856f697a0b1e58b3e986f44e62f0cd0bca2424f1aac --checksum-url https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/hashes.sha256
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Source observer contracts (offline, no credentials)
        run: python packages/vfigos/schedule_observer/test-source-reconciler.py
      - name: Meta reader syntax
        run: node --check packages/vfigos/schedule_observer/reader-v3.cjs
