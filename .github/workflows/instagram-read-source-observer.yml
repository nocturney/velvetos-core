name: Instagram read-source observer checks

on:
  pull_request:
    paths:
      - "packages/vfigos/schedule_observer/**"
      - ".github/workflows/instagram-read-source-observer.yml"
  push:
    branches: [main]
    paths:
      - "packages/vfigos/schedule_observer/**"
      - ".github/workflows/instagram-read-source-observer.yml"

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Source observer contracts (offline, no credentials)
        run: python packages/vfigos/schedule_observer/test-source-reconciler.py
      - name: Meta reader syntax
        run: node --check packages/vfigos/schedule_observer/reader-v3.cjs
